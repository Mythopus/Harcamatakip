<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Harcama Takip</title>
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface-1: #f1efe8;
    --border: #d8d6cf;
    --border-strong: #b4b2a9;
    --text-primary: #2c2c2a;
    --text-secondary: #5f5e5a;
    --text-muted: #888780;
    --accent: #378add;
    --danger: #e24b4a;
    --danger-dark: #791f1f;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }
  #app { width: 100%; max-width: 480px; }
  h1 {
    font-size: 20px;
    font-weight: 500;
    margin: 0 0 20px;
  }
  input, textarea, button {
    font-family: inherit;
    font-size: 14px;
  }
  input[type="text"], input[type="number"], input[type="date"], textarea {
    width: 100%;
    padding: 8px 10px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-primary);
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(55,138,221,0.2);
  }
  button {
    padding: 8px 14px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border-strong);
    background: transparent;
    color: var(--text-primary);
    cursor: pointer;
  }
  button:hover { background: var(--surface-1); }
  button:active { transform: scale(0.98); }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .label { font-size: 13px; color: var(--text-secondary); }
  .big { font-size: 24px; font-weight: 500; }
  #limitInput { width: 90px; text-align: right; }
  #progressWrap {
    height: 8px;
    border-radius: 4px;
    background: var(--surface-1);
    overflow: hidden;
    margin-bottom: 4px;
  }
  #progressBar { height: 100%; width: 0%; background: var(--accent); transition: width .2s; }
  #progressText { font-size: 12px; color: var(--text-secondary); margin-bottom: 24px; }
  .card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 24px;
  }
  .card-title { font-size: 15px; font-weight: 500; margin-bottom: 10px; }
  .form-col { display: flex; flex-direction: column; gap: 8px; }
  .form-row { display: flex; gap: 8px; }
  .form-row > * { flex: 1; }
  #formError { display: none; font-size: 13px; color: var(--danger-dark); }
  .day-block { margin-bottom: 20px; }
  .day-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 2px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .day-header .over { color: var(--danger-dark); }
  .expense-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 8px 0;
    border-top: 0.5px solid var(--border);
  }
  .expense-name { font-size: 14px; font-weight: 500; }
  .expense-note { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .expense-right { display: flex; align-items: center; gap: 8px; }
  .del-btn { padding: 4px 8px; border: none; color: var(--text-muted); }
  .del-btn:hover { color: var(--danger-dark); background: var(--surface-1); }
  .empty { text-align: center; color: var(--text-muted); font-size: 14px; padding: 32px 0; }
</style>
</head>
<body>
<div id="app">
  <h1>Harcama takip</h1>

  <div class="top-row">
    <div>
      <div class="label">Bugünkü toplam</div>
      <div id="todayTotal" class="big">0 TL</div>
    </div>
    <div style="text-align:right;">
      <div class="label">Günlük limit</div>
      <div style="display:flex; align-items:center; gap:6px; justify-content:flex-end;">
        <input id="limitInput" type="number" step="1" />
        <span style="font-size:13px;">TL</span>
      </div>
    </div>
  </div>

  <div id="progressWrap"><div id="progressBar"></div></div>
  <div id="progressText"></div>

  <div class="card">
    <div class="card-title">Yeni harcama</div>
    <div class="form-col">
      <input id="fName" type="text" placeholder="Harcama adı (ör. market)" />
      <div class="form-row">
        <input id="fAmount" type="number" step="0.01" placeholder="Tutar (TL)" />
        <input id="fDate" type="date" />
      </div>
      <textarea id="fNote" placeholder="Not (opsiyonel)" rows="2"></textarea>
      <div id="formError"></div>
      <button id="addBtn" style="align-self:flex-start;">+ Ekle</button>
    </div>
  </div>

  <div id="list"></div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'harcama_takip_expenses';
  const LIMIT_KEY = 'harcama_takip_limit';
  let expenses = [];
  let limit = 500;

  function todayStr(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function fmt(n){ return (Math.round(n*100)/100).toLocaleString('tr-TR') + ' TL'; }
  function fmtDate(s){
    const [y,m,d] = s.split('-');
    return d+'.'+m+'.'+y;
  }
  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function load(){
    try { expenses = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e){ expenses = []; }
    try { limit = JSON.parse(localStorage.getItem(LIMIT_KEY) || '500'); } catch(e){ limit = 500; }
    document.getElementById('limitInput').value = limit;
    document.getElementById('fDate').value = todayStr();
    render();
  }
  function saveExpenses(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses)); }
  function saveLimit(){ localStorage.setItem(LIMIT_KEY, JSON.stringify(limit)); }

  function render(){
    const today = todayStr();
    const todayExpenses = expenses.filter(e => e.date === today);
    const todayTotal = todayExpenses.reduce((s,e)=>s+e.amount,0);
    document.getElementById('todayTotal').textContent = fmt(todayTotal);

    const pct = Math.min(100, (todayTotal/limit)*100 || 0);
    const bar = document.getElementById('progressBar');
    bar.style.width = pct+'%';
    bar.style.background = todayTotal > limit ? 'var(--danger)' : 'var(--accent)';

    const txt = document.getElementById('progressText');
    if(todayTotal > limit){
      txt.textContent = 'Limit aşıldı: ' + fmt(todayTotal-limit) + ' fazla';
      txt.style.color = 'var(--danger-dark)';
    } else {
      txt.textContent = fmt(limit-todayTotal) + ' kaldı';
      txt.style.color = 'var(--text-secondary)';
    }

    const byDate = {};
    expenses.forEach(e => { (byDate[e.date] = byDate[e.date]||[]).push(e); });
    const dates = Object.keys(byDate).sort().reverse();
    const list = document.getElementById('list');

    if(dates.length === 0){
      list.innerHTML = '<div class="empty">Henüz harcama yok.</div>';
      return;
    }

    list.innerHTML = dates.map(date => {
      const items = byDate[date];
      const dayTotal = items.reduce((s,e)=>s+e.amount,0);
      const over = dayTotal > limit;
      const rows = items.map(e => `
        <div class="expense-row">
          <div style="flex:1;">
            <div class="expense-name">${escapeHtml(e.name)}</div>
            ${e.note ? '<div class="expense-note">'+escapeHtml(e.note)+'</div>' : ''}
          </div>
          <div class="expense-right">
            <div style="font-size:14px; font-weight:500;">${fmt(e.amount)}</div>
            <button data-id="${e.id}" class="delBtn del-btn" aria-label="Sil">✕</button>
          </div>
        </div>`).join('');
      return `<div class="day-block">
        <div class="day-header">
          <span>${fmtDate(date)}${date===today ? ' (bugün)' : ''}</span>
          <span class="${over ? 'over' : ''}">${fmt(dayTotal)}${over ? ' / aşıldı' : ''}</span>
        </div>
        ${rows}
      </div>`;
    }).join('');

    document.querySelectorAll('.delBtn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.getAttribute('data-id');
        expenses = expenses.filter(e => String(e.id) !== id);
        saveExpenses();
        render();
      });
    });
  }

  document.getElementById('limitInput').addEventListener('change', (e)=>{
    const v = parseFloat(e.target.value);
    if(!isNaN(v) && v > 0){
      limit = v;
      saveLimit();
      render();
    } else {
      e.target.value = limit;
    }
  });

  document.getElementById('addBtn').addEventListener('click', ()=>{
    const name = document.getElementById('fName').value.trim();
    const amount = parseFloat(document.getElementById('fAmount').value);
    const date = document.getElementById('fDate').value;
    const note = document.getElementById('fNote').value.trim();
    const errEl = document.getElementById('formError');

    if(!name || isNaN(amount) || amount <= 0 || !date){
      errEl.textContent = 'Lütfen harcama adı, geçerli bir tutar ve tarih girin.';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';

    expenses.push({ id: Date.now()+'_'+Math.random().toString(36).slice(2), name, amount, date, note });
    saveExpenses();

    document.getElementById('fName').value = '';
    document.getElementById('fAmount').value = '';
    document.getElementById('fNote').value = '';
    document.getElementById('fDate').value = todayStr();
    render();
  });

  load();
})();
</script>
</body>
</html>
